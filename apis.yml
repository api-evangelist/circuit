aid: circuit
name: Circuit
description: >-
  Circuit (operating publicly as Spoke; legal entity Circuit Routing Limited)
  builds last-mile delivery route-optimization software. Its products are Route
  Planner, a free driver app for uploading stops, optimizing multi-stop routes
  and navigating; Dispatch, a multi-driver delivery-management platform with
  route planning, live tracking and proof of delivery for courier operations;
  and Connect, a marketplace that lets retailers discover local couriers and
  track deliveries. The Spoke Public API (formerly the Circuit for Teams API)
  is an HTTP/JSON API that lets teams manage plans, stops, unassigned stops,
  drivers, depots, routes, members and long-running operations programmatically,
  optimize and distribute plans across drivers, run full-text stop search with a
  filtering DSL, and subscribe to webhook events for delivery workflows.
