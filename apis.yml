- aid: circuit:circuit-live-stops-api
  name: Circuit Live Stops API
  description: >-
    Endpoints to operate on [Stop](/docs/models/stop) resources when the plan is already optimized and
    therefore not writable.


    All the endpoints return the field `pending`. This field indicates whether the

    change has been applied to the plan or if it's pending a new optimization and distribution. On `pending
    = true`,

    you must use the [re-optimize](#tag/Live-Plans/operation/reoptimizePlan) and [re-distribute](#tag/Live-Plans/operation/redistributePlan)

    endpoints to apply the changes to the plan.
  humanURL: https://developer.dispatch.spoke.com/
