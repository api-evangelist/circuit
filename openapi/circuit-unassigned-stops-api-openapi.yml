                        - earliestAttemptTime
                        - latestAttemptTime
                        additionalProperties: false
                        description: The timing data of the stop.
                      optimizationOrder:
                        default: default
                        type: string
                        enum:
                        - first
                        - last
                        - default
                      paymentOnDelivery:
                        anyOf:
                        - type: object
                          properties:
                            amount:
                              anyOf:
                              - type: integer
                                minimum: 0
                                maximum: 9007199254740991
                              - type: 'null'
                              description: The amount *in minor units* (e.g. cents) to be collected upon delivery.
                            currency:
                              type: string
                              description: The payment's currency in ISO 4217 standard.
                          required:
                          - amount
                          - currency
                          additionalProperties: false
                          description: The payment due upon delivery also known as "Cash on Delivery".
                        - type: 'null'
                      proofOfAttemptRequirements:
                        type: object
                        properties:
                          enabled:
                            anyOf:
                            - type: boolean
                            - type: 'null'
