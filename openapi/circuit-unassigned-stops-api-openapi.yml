                          items:
                            type: string
                            pattern: ^drivers\/[a-zA-Z0-9---_]{1,50}$
                        - type: 'null'
                      activity:
                        description: Activity type
                        default: delivery
                        anyOf:
                        - type: string
                          enum:
                          - delivery
                          - pickup
                        - type: 'null'
                      optimizationOrder:
                        description: The preferred order of this stop in the optimized route. If not provided or `"default"`, the stop will be placed in the optimal order, decided by the optimization algorithm. Otherwise it will be placed either `"first"` or `"last"`.
                        anyOf:
                        - type: string
                          enum:
                          - first
                          - last
                          - default
                        - type: 'null'
                      packageCount:
                        description: Number of packages in the stop
                        anyOf:
                        - type: number
                          minimum: 1
                          maximum: 10000
                        - type: 'null'
                      weight:
                        description: Weight information for this stop.
                        anyOf:
                        - type: object
                          properties:
                            amount:
                              description: The weight amount for this stop.
                              type: number
                              minimum: 0
                              maximum: 999999
                              multipleOf: 0.01
                            unit:
                              description: The weight unit in which the amount is specified.
                              type: string
                              enum:
                              - kilogram
                              - pound
                              - metric-ton
                          required:
                          - amount
                          - unit
                        - type: 'null'
                      notes:
                        description: Notes for the stop
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 2000
                        - type: 'null'
                      clientId:
                        description: Client ID of the retailer in Spoke Connect
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 100
                        - type: 'null'
                      barcodes:
                        description: List of barcode IDs associated with this stop
                        maxItems: 200
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 255
                      customProperties:
                        description: Key-value pairs of custom stop properties for this stop. The keys must be unique and match a custom stop property defined in your team.
                        anyOf:
                        - type: object
                          propertyNames:
                            description: The custom stop property id
                            type: string
                            maxLength: 50
                          additionalProperties:
                            description: The value of the custom stop property, up to 255 characters.
                            anyOf:
                            - type: string
                              minLength: 1
                              maxLength: 255
                            - type: 'null'
                        - type: 'null'
                    required:
                    - address
                    additionalProperties: false
                depot:
                  description: The Depot ID the unassigned stops in the batch belong to, in the format `depot/<id>`. This is used to bias the geocoding results of the unassigned stops, so every unassigned stop in the batch should belong to the same depot. If not provided, or null, it will default to the team's main depot.
                  anyOf:
                  - type: string
                    pattern: ^depots\/[a-zA-Z0-9---_]{1,50}$
                  - type: 'null'
              required:
              - unassignedStops
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: array
                    items:
                      type: string
                      pattern: ^unassignedStops\/[a-zA-Z0-9---_]{1,50}$
                      description: The id of the unassigned stop, in the format `unassignedStops/<id>`.
                    description: The ids of the successfully imported unassigned stops
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        error:
                          type: object
                          properties:
                            message:
                              type: string
                              description: The error that occurred during import
                          required:
                          - message
                        unassignedStop:
                          type: object
                          properties:
                            address:
                              type: object
                              properties:
                                addressName:
                                  anyOf:
                                  - type: string
                                    minLength: 1
                                    maxLength: 255
                                  - type: 'null'
                                  description: The name of the address. This will not be used for geocoding, and is only for the final address display purposes.
                                addressLineOne:
                                  anyOf:
                                  - type: string
                                    minLength: 1
                                    maxLength: 255
                                  - type: 'null'
                                  description: The first line of the address.
                                addressLineTwo:
                                  anyOf:
                                  - type: string
                                    minLength: 1
                                    maxLength: 255
                                  - type: 'null'
                                  description: The second line of the address.
                                city:
                                  anyOf:
                                  - type: string
                                    minLength: 1
                                    maxLength: 100
                                  - type: 'null'
                                  description: The city of the address.
                                state:
                                  anyOf:
                                  - type: string
                                    minLength: 1
                                    maxLength: 100
                                  - type: 'null'
                                  description: The state of the address.
                                zip:
                                  anyOf:
                                  - type: string
                                    minLength: 1
                                    maxLength: 100
                                  - type: 'null'
                                  description: The zip code of the address.
                                country:
                                  anyOf:
                                  - type: string
                                    minLength: 1
                                    maxLength: 100
                                  - type: 'null'
                                  description: The country of the address.
                                latitude:
                                  anyOf:
                                  - type: number
                                    minimum: -90
                                    maximum: 90
                                  - type: 'null'
                                  description: The latitude of the address in decimal degrees.
                                longitude:
                                  anyOf:
                                  - type: number
                                    minimum: -180
                                    maximum: 180
                                  - type: 'null'
                                  description: The longitude of the address in decimal degrees.
                              required:
                              - addressName
                              - addressLineOne
                              - addressLineTwo
                              - city
                              - state
                              - zip
                              - country
                              - latitude
                              - longitude
                              additionalProperties: false
                              description: The address of the unassigned stop that failed to import
                            recipient:
                              anyOf:
                              - type: object
                                properties:
                                  externalId:
                                    anyOf:
                                    - type: string
                                      minLength: 1
                                      maxLength: 255
                                    - type: 'null'
                                    description: External ID of the recipient, as defined by the API user
                                  email:
                                    anyOf:
                                    - type: string
                                      minLength: 1
                                      maxLength: 255
                                    - type: 'null'
                                    description: Email of the recipient
                                  phone:
                                    anyOf:
                                    - type: string
                                      minLength: 1
                                      maxLength: 255
                                    - type: 'null'
                                    description: Phone number of the recipient
                                  name:
                                    anyOf:
                                    - type: string
                                      minLength: 1
                                      maxLength: 255
                                    - type: 'null'
                                    description: Name of the recipient
                                required:
                                - externalId
                                - email
                                - phone
                                - name
                                additionalProperties: false
                              - type: 'null'
                              description: The recipient of the unassigned stop that failed to import
                          required:
                          - address
                          - recipient
                          description: The unassigned stop that failed to import
                      required:
                      - error
                      - unassignedStop
                    description: The failed unassigned stops
                required:
                - success
                - failed
                description: Success
        '400':
          description: The request has errors. Either syntactic or semantic
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  code:
                    type: string
                    description: The error code.
                  param:
                    type: string
                    description: The parameter that caused the error.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: The request has errors. Either syntactic or semantic
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: Unauthorized
        '403':
          description: The request contains fields that are not supported by your team subscription/settings.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                      description: The error message.
                    code:
                      type: string
                      enum:
                      - feature_not_in_subscription
                    url:
                      type: string
                      enum:
                      - https://dispatch.spoke.com/paywall
                  required:
                  - message
                  - code
                  - url
                  description: Feature not included in your team subscription
                - type: object
                  properties:
                    message:
                      type: string
                      description: The error message.
                    code:
                      type: string
                      enum:
                      - vehicle_capacity_disabled
                    url:
                      type: string
                      enum:
                      - https://dispatch.spoke.com/settings/team-profile
                  required:
                  - message
                  - code
                  - url
                  description: Vehicle capacity mode is disabled in the team's settings
                description: The request contains fields that are not supported by your team subscription/settings.
        '404':
          description: A depot or a driver was not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                required:
                - message
                description: A depot or a driver was not found
        '422':
          description: Failed to create stop
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - An error occurred when creating the unassigned stop, but the error is not due to a validation error, instead it is another conflict, check if the provided data is semantically valid.
                    - type: string
                required:
                - message
                description: Failed to create stop
        '500':
          description: An internal server error occurred
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  code:
                    type: string
                    description: The error code.
                  param:
                    type: string
                    description: The parameter that caused the error.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: An internal server error occurred
        default:
          description: The default error model
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  code:
                    type: string
                    description: The error code.
                  param:
                    type: string
                    description: The parameter that caused the error.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: The default error model
components:
  schemas:
    timeOfDaySchema:
      type: object
      properties:
        hour:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Hour of the day
        minute:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Minute of the hour
      required:
      - hour
      - minute
      additionalProperties: false
      description: Time of day in hours and minutes. Uses a 24 hour clock.
    unassignedStopSchema:
      type: object
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/unassignedStopIdSchema'
          description: The id of the unassigned stop, in the format `unassignedStops/<id>`.
        depot:
          type: string
          pattern: ^depots\/[a-zA-Z0-9---_]{1,50}$
          description: The depot that this unassigned stop belongs to.
        address:
          type: object
          properties:
            address:
              type: string
              description: The address of the stop.
            addressLineOne:
              type: string
              description: The first line of the address.
            addressLineTwo:
              type: string
              description: The second line of the address.
            latitude:
              anyOf:
              - type: number
                minimum: -90
                maximum: 90
              - type: 'null'
              description: The latitude of the address in decimal degrees.
            longitude:
              anyOf:
              - type: number
                minimum: -180
                maximum: 180
              - type: 'null'
              description: The longitude of the address in decimal degrees.
            placeId:
              anyOf:
              - type: string
              - type: 'null'
              description: The identifier of the place corresponding to this stop on Google Places
            placeTypes:
              type: array
              items:
                type: string
              description: Array of strings that is provided by the Google AutoCompleteAPI
          required:
          - address
          - addressLineOne
          - addressLineTwo
          - latitude
          - longitude
          - placeId
          - placeTypes
          additionalProperties: false
          description: The address of the stop.
        barcodes:
          type: array
          items:
            type: string
          description: List of Barcode IDs associated with the stop.
        allowedDrivers:
          type: array
          items:
            type: string
            pattern: ^drivers\/[a-zA-Z0-9---_]{1,50}$
          description: The driver IDs that can be assigned to this stop.
        notes:
          anyOf:
          - type: string
          - type: 'null'
          description: Notes for the stop.
        packageCount:
          anyOf:
          - type: number
          - type: 'null'
          description: The number of packages.
        weight:
          anyOf:
          - type: object
            properties:
              amount:
                type: number
                minimum: 0
                description: The weight amount for this stop.
              unit:
                type: string
                enum:
                - kilogram
                - pound
                - metric-ton
                description: The weight unit in which the amount is specified (defined at team's capacity unit).
            required:
            - amount
            - unit
            additionalProperties: false
            description: Weight information for the stop.
          - type: 'null'
        orderInfo:
          type: object
          properties:
            products:
              type: array
              items:
                type: string
              description: The products of the stop.
            invoiceNumber:
              anyOf:
              - type: string
              - type: 'null'
              description: Invoice number associated with the order.
            sellerName:
              anyOf:
              - type: string
              - type: 'null'
              description: Name of the seller where the order is from.
            sellerOrderId:
              anyOf:
              - type: string
              - type: 'null'
              description: Id of the seller where the order is from.
            sellerWebsite:
              anyOf:
              - type: string
              - type: 'null'
              description: Website of the seller where the order is from.
          required:
          - products
          - invoiceNumber
          - sellerName
          - sellerOrderId
          - sellerWebsite
          additionalProperties: false
          description: The order information of the stop.
        recipient:
          type: object
          properties:
            name:
              anyOf:
              - type: string
              - type: 'null'
              description: The name of the recipient.
            email:
              anyOf:
              - type: string
              - type: 'null'
              description: The email of the recipient.
            phone:
              anyOf:
              - type: string
              - type: 'null'
              description: The phone of the recipient.
            externalId:
              anyOf:
              - type: string
              - type: 'null'
              description: The external id of the recipient.
          required:
          - name
          - email
          - phone
          - externalId
          additionalProperties: false
          description: The recipient of the stop.
        activity:
          default: delivery
          type: string
          enum:
          - delivery
          - pickup
        trackingLink:
          anyOf:
          - type: string
          - type: 'null'
          description: The recipient tracking link.
        timing:
          type: object
          properties:
            estimatedAttemptDuration:
              anyOf:
              - type: number
              - type: 'null'
              description: Time that the driver estimates to spend on the stop to do his job (deliver a parcel, visit a client, etc) in seconds.
            earliestAttemptTime:
              anyOf:
              - $ref: '#/components/schemas/timeOfDaySchema'
              - type: 'null'
              description: The earliest time that the driver should arrive at the stop
            latestAttemptTime:
              anyOf:
              - $ref: '#/components/schemas/timeOfDaySchema'
              - type: 'null'
              description: The latest time that the driver should arrive at the stop.
          required:
          - estimatedAttemptDuration
          - earliestAttemptTime
          - latestAttemptTime
          additionalProperties: false
          description: The timing data of the stop.
        optimizationOrder:
          default: default
          type: string
          enum:
          - first
          - last
          - default
        paymentOnDelivery:
          anyOf:
          - type: object
            properties:
              amount:
                anyOf:
                - type: integer
                  minimum: 0
                  maximum: 9007199254740991
                - type: 'null'
                description: The amount *in minor units* (e.g. cents) to be collected upon delivery.
              currency:
                type: string
                description: The payment's currency in ISO 4217 standard.
            required:
            - amount
            - currency
            additionalProperties: false
            description: The payment due upon delivery also known as "Cash on Delivery".
          - type: 'null'
        proofOfAttemptRequirements:
          type: object
          properties:
            enabled:
              anyOf:
              - type: boolean
              - type: 'null'
              description: Whether the proof of attempt is enabled.This only works if the team subscription has access to proof of delivery
          required:
          - enabled
          additionalProperties: false
          description: The proof of attempt requirements of the stop.
        customProperties:
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties:
              anyOf:
              - type: string
              - type: 'null'
          - type: 'null'
          description: Custom properties of the stop, can be used to store additional information.
        clientId:
          anyOf:
          - type: string
          - type: 'null'
          description: The associated Client ID of the Spoke Connect
      required:
      - id
      - depot
      - address
      - barcodes
      - allowedDrivers
      - notes
      - packageCount
      - weight
      - orderInfo
      - recipient
      - trackingLink
      - timing
      - paymentOnDelivery
      - proofOfAttemptRequirements
      - customProperties
      - clientId
      additionalProperties: false
      description: An unassigned stop.
    unassignedStopIdSchema:
      type: string
      pattern: ^unassignedStops\/[a-zA-Z0-9---_]{1,50}$
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: Use the API key as the username and leave the password empty.
