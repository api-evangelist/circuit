                        description: The proof of attempt requirements of the stop.
                      customProperties:
                        anyOf:
                        - type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            anyOf:
                            - type: string
                            - type: 'null'
                        - type: 'null'
                        description: Custom properties of the stop, can be used to store additional information.
                      circuitClientId:
                        anyOf:
                        - type: string
                        - type: 'null'
