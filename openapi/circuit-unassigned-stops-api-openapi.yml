                            description: The state of the address.
                            anyOf:
                            - type: string
                              minLength: 1
                              maxLength: 100
                            - type: 'null'
                          zip:
                            description: The zip code of the address.
                            anyOf:
                            - type: string
                              minLength: 1
                              maxLength: 100
                            - type: 'null'
                          country:
                            description: The country of the address.
                            anyOf:
                            - type: string
                              minLength: 1
                              maxLength: 100
                            - type: 'null'
                          latitude:
                            description: The latitude of the address in decimal degrees.
                            anyOf:
                            - type: number
                              minimum: -90
                              maximum: 90
                            - type: 'null'
                          longitude:
                            description: The longitude of the address in decimal degrees.
                            anyOf:
                            - type: number
                              minimum: -180
                              maximum: 180
                            - type: 'null'
                        additionalProperties: false
                      timing:
                        anyOf:
                        - description: Timing information for this stop
                          type: object
                          properties:
                            earliestAttemptTime:
                              description: Time of day of the earliest time this stop should happen
                              anyOf:
                              - description: Time of day in hours and minutes. Use a 24 hour clock.
                                type: object
                                properties:
                                  hour:
                                    description: Hour of the day
                                    type: integer
                                    minimum: -9007199254740991
                                    maximum: 9007199254740991
                                  minute:
