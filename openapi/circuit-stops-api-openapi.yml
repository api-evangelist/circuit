                      customProperties:
                        anyOf:
                        - type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            anyOf:
                            - type: string
                            - type: 'null'
                        - type: 'null'
                        description: Custom properties of the stop, can be used to store additional information.
                      clientId:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: The associated Client ID of the Spoke Connect
                    required:
                    - id
                    - depot
                    - address
                    - barcodes
                    - allowedDrivers
                    - notes
                    - packageCount
                    - weight
                    - orderInfo
                    - recipient
                    - trackingLink
                    - timing
                    - paymentOnDelivery
                    - proofOfAttemptRequirements
                    - customProperties
                    - clientId
