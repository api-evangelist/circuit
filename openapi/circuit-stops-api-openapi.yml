  /stops:search:
    get:
      operationId: searchStops
      summary: Stop Search
      tags:
      - Stops
      description: "See the [Stops Search docs](/api/v1#section/Using-the-API/Stop-Search-API) for more information on formatting the filter string.\n  The following fields are filterable:\n  - `planId` - The ID of the plan stop is linked to in PlanId format (e.g. `plans/{planId}`)\n  - `routeId` - The ID of the route stop is linked to in RouteId format (e.g. `routes/{routeId}`)\n  - `type` - The type of the stop (e.g. `start`, `stop`, `end`)\n  - `activity` - The activity performed at the stop (`delivery` or `pickup`)\n  - `notes` - Notes associated with the stop\n  - `orderInfo.sellerOrderId` - The order ID from the seller\n  - `orderInfo.invoiceNumber` - The invoice number of the order\n  - `orderInfo.sellerWebsite` - The website URL of the seller\n  - `address.address` - The full address of the stop\n  - `address.addressLineOne` - The first line of the stop address\n  - `address.addressLineTwo` - The second line of the stop address\n  - `address.latitude` - The latitude of the stop address in decimal degrees\n  - `address.longitude` - The longitude of the stop address in decimal degrees\n  - `address.placeId` - The Google Places identifier for the address\n  - `address.countryCode` - The ISO country code for the address\n  - `createdAt` - The timestamp when the stop was created (ISO 8601)\n  - `arrivalAt` - The timestamp of the (estimated) arrival at the stop (ISO 8601)\n  - `packageCount` - The number of packages to be delivered or picked up\n  - `estimatedTravelDuration` - The estimated travel time to this stop from the previous one, in seconds\n  - `estimatedTravelDistance` - The estimated travel distance to this stop from the previous one, in meters\n  - `timing.estimatedAttemptDuration` - The estimated time spent at the stop to perform the activity, in seconds\n  - `recipient.name` - The name of the recipient at the stop\n  - `recipient.email` - The email address of the recipient\n  - `recipient.phone` - The phone number of the recipient\n  - `recipient.externalId` - An external identifier for the recipient\n  - `deliveryInfo.state` - The current state of the delivery (e.g. `delivered_to_recipient`, `failed_not_home`)\n  - `deliveryInfo.attempted` - Whether a delivery attempt has been made\n  - `deliveryInfo.succeeded` - Whether the delivery was successful\n  - `deliveryInfo.recipientProvidedNotes` - Notes provided by the recipient for the driver\n  - `deliveryInfo.driverProvidedInternalNotes` - Internal notes provided by the driver\n  - `deliveryInfo.driverProvidedRecipientNotes` - Notes for the recipient provided by the driver\n  - `deliveryInfo.signeeName` - The name of the person who signed for the delivery\n  - `deliveryInfo.attemptedAt` - The timestamp when the delivery was attempted (ISO 8601)\n  - `orderInfo.products` - The list of products included in the order\n  - `orderInfo.sellerName` - The name of the seller\n  - `paymentOnDelivery.amount` - The amount to be collected on delivery, in original units\n  - `barcodes` - The list of barcodes associated with the stop\n  - `packageLabel` - The label applied to the package(s)\n  - `customProperties.*` - A custom property of the stop. Replace `*` with the custom property ID.\n\n  The following fields are sortable:\n  - `address.latitude`\n  - `address.longitude`\n  - `createdAt`\n  - `arrivalAt`\n  - `packageCount`\n  - `estimatedTravelDuration`\n  - `estimatedTravelDistance`\n  - `timing.estimatedAttemptDuration`\n  - `deliveryInfo.attemptedAt`\n  - `paymentOnDelivery.amount`\n"
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 255
        in: query
        name: keyword
        required: false
        description: Keywords to include in the search. These will be applied to all applicable text fields using a fuzzy matching.
      - schema:
          type: string
          minLength: 1
          maxLength: 2048
        in: query
        name: filter
        required: false
        description: The filter to apply. This is used to include/exclude stops form the search.
      - schema:
          type: string
        in: query
        name: pageToken
        required: false
        description: The page token.
      - schema:
          default: 20
          type: integer
          exclusiveMinimum: 1
          exclusiveMaximum: 20
        in: query
        name: maxPageSize
        required: false
        description: The max page size.
      - schema:
          type: string
        in: query
        name: sortField
        required: false
        description: The sort field.
      - schema:
          default: asc
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sortOrder
        required: false
        description: The sort direction.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  stops:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            description: The type of the stop.
                            enum:
                            - stop
                          stop:
                            allOf:
                            - $ref: '#/components/schemas/stopSchema_2'
                            description: The stop.
                        required:
                        - type
                        - stop
                      - type: object
                        properties:
                          type:
                            type: string
                            description: The type of the stop.
                            enum:
                            - unassignedStop
                          unassignedStop:
                            allOf:
                            - $ref: '#/components/schemas/unassignedStopSchema'
                            description: The unassigned stop.
                        required:
                        - type
                        - unassignedStop
                    description: The stops list.
                  nextPageToken:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The next page token.
                required:
                - stops
                - nextPageToken
                definitions:
                  stopSchema:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^plans\/[a-zA-Z0-9---_]{1,50}\/stops\/[a-zA-Z0-9---_]{1,50}$
                        description: The id of the stop, in the format `plans/<id>/stops/<id>`.
                      address:
                        type: object
                        properties:
                          address:
                            type: string
                            description: The address of the stop.
                          addressLineOne:
                            type: string
                            description: The first line of the address.
                          addressLineTwo:
                            type: string
                            description: The second line of the address.
                          latitude:
                            anyOf:
                            - type: number
                              minimum: -90
                              maximum: 90
                            - type: 'null'
                            description: The latitude of the address in decimal degrees.
                          longitude:
                            anyOf:
                            - type: number
                              minimum: -180
                              maximum: 180
                            - type: 'null'
                            description: The longitude of the address in decimal degrees.
                          placeId:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: The identifier of the place corresponding to this stop on Google Places
                          placeTypes:
                            type: array
                            items:
                              type: string
                            description: Array of strings that is provided by the Google AutoCompleteAPI
                        required:
                        - address
                        - addressLineOne
                        - addressLineTwo
                        - latitude
                        - longitude
                        - placeId
                        - placeTypes
                        additionalProperties: false
                        description: The address of the stop.
                      barcodes:
                        type: array
                        items:
                          type: string
                        description: List of Barcode IDs associated with the stop.
                      allowedDrivers:
                        type: array
                        items:
                          type: string
                          pattern: ^drivers\/[a-zA-Z0-9---_]{1,50}$
                        description: The driver IDs that can be assigned to this stop
                      estimatedTravelDuration:
                        anyOf:
                        - type: number
                        - type: 'null'
                        description: Estimated time that the driver will take to arrive at this stop from the previous stop in seconds.
                      estimatedTravelDistance:
                        anyOf:
                        - type: number
                        - type: 'null'
                        description: The distance in meters between the previous stop and this stop.
                      notes:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Notes for the stop.
                      packageCount:
                        anyOf:
                        - type: number
                        - type: 'null'
                        description: The number of packages.
                      weight:
                        anyOf:
                        - type: object
                          properties:
                            amount:
                              type: number
                              minimum: 0
                              description: The weight amount for this stop.
                            unit:
                              type: string
                              enum:
                              - kilogram
                              - pound
                              - metric-ton
                              description: The weight unit in which the amount is specified (defined at team's capacity unit).
                          required:
                          - amount
                          - unit
                          additionalProperties: false
                          description: Weight information for the stop.
                        - type: 'null'
                      type:
                        type: string
                        enum:
                        - start
                        - stop
                        - end
                        description: The type of the stop. `start` is the first stop of the route, `stop` is a stop in the middle of the route, and `end` is the last stop of the route.
                      packageLabel:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: The label of the package.
                      stopPosition:
                        anyOf:
                        - type: number
                        - type: 'null'
                        description: The position of the stop in the route.
                      trackingLink:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: The recipient tracking link.
                      webAppLink:
                        type: string
                        description: The web app link.
                      orderInfo:
                        type: object
                        properties:
                          products:
                            type: array
                            items:
                              type: string
                            description: The products of the stop.
                          invoiceNumber:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Invoice number associated with the order.
                          sellerName:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Name of the seller where the order is from.
                          sellerOrderId:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Id of the seller where the order is from.
                          sellerWebsite:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: Website of the seller where the order is from.
                        required:
                        - products
                        - invoiceNumber
                        - sellerName
                        - sellerOrderId
                        - sellerWebsite
                        additionalProperties: false
                        description: The order information of the stop.
                      placeInVehicle:
                        anyOf:
                        - type: object
                          properties:
                            x:
                              anyOf:
                              - type: string
                                enum:
                                - left
                                - right
                              - type: 'null'
                              description: The x position of the package.
                            y:
                              anyOf:
                              - type: string
                                enum:
                                - front
                                - back
                                - middle
                              - type: 'null'
                              description: The y position of the package.
                            z:
                              anyOf:
                              - type: string
                                enum:
                                - floor
                                - shelf
                              - type: 'null'
                              description: The z position of the package.
                          required:
                          - x
                          - y
                          - z
                          additionalProperties: false
                          description: The position of the package in the vehicle.
                        - type: 'null'
                      recipient:
                        type: object
                        properties:
                          name:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: The name of the recipient.
                          email:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: The email of the recipient.
                          phone:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: The phone of the recipient.
                          externalId:
                            anyOf:
                            - type: string
                            - type: 'null'
                            description: The external id of the recipient.
                        required:
                        - name
                        - email
                        - phone
                        - externalId
                        additionalProperties: false
                        description: The recipient of the stop.
                      activity:
                        default: delivery
                        type: string
                        enum:
                        - delivery
                        - pickup
                      deliveryInfo:
                        anyOf:
                        - type: object
                          properties:
                            attempted:
                              type: boolean
                              description: Whether the stop was attempted.
                            attemptedAt:
                              anyOf:
                              - type: number
                              - type: 'null'
                              description: When the stop was attempted in seconds since epoch.
                            timeAtStopInfo:
                              oneOf:
                              - type: object
                                properties:
                                  status:
                                    type: string
                                    enum:
                                    - available
                                  value:
                                    type: object
                                    properties:
                                      arrivedAt:
                                        anyOf:
                                        - type: number
                                        - type: 'null'
                                        description: When the driver arrived at the stop in seconds since epoch.
                                      departedAt:
                                        anyOf:
                                        - type: number
                                        - type: 'null'
                                        description: When the driver departed from the stop in seconds since epoch.
                                      isEstimated:
                                        anyOf:
                                        - type: boolean
                                        - type: 'null'
                                        description: Whether the time at stop was estimated rather than directly measured.
                                    required:
                                    - arrivedAt
                                    - departedAt
                                    - isEstimated
                                    additionalProperties: false
                                    description: Grouped time-at-stop data.
                                required:
                                - status
                                - value
                                additionalProperties: false
                              - type: object
                                properties:
                                  status:
                                    type: string
                                    enum:
                                    - restricted
                                  requiredFeature:
                                    type: string
                                  upgradeUrl:
                                    type: string
                                  restrictionCode:
                                    type: string
                                    enum:
                                    - subscription_not_supported
                                required:
                                - status
                                additionalProperties: false
                              - type: object
                                properties:
                                  status:
                                    type: string
                                    enum:
                                    - pending
                                  pendingReason:
                                    type: string
                                    enum:
                                    - not_yet_arrived
                                required:
                                - status
                                additionalProperties: false
                            attemptedLocation:
                              anyOf:
                              - type: object
                                properties:
                                  latitude:
                                    type: number
                                    description: The latitude of the location.
                                  longitude:
                                    type: number
                                    description: The longitude of the location.
                                required:
                                - latitude
                                - longitude
                                additionalProperties: false
                                description: A location.
                              - type: 'null'
                              description: Where the stop was attempted.
                            driverProvidedInternalNotes:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Internal notes provided by the driver.
                            driverProvidedRecipientNotes:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Recipient notes provided by the driver.
                            photoUrls:
                              type: array
                              items:
                                type: string
                              description: URLs of proof of delivery photos.
                            recipientProvidedNotes:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: Notes from recipient
                            signatureUrl:
                              anyOf:
