                          additionalProperties:
                            anyOf:
                            - type: string
                            - type: 'null'
                        - type: 'null'
                        description: Custom properties of the stop, can be used to store additional information.
                      circuitClientId:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: The associated Client ID of the Spoke Connect
                    required:
                    - id
                    - address
                    - barcodes
                    - driverIdentifier
                    - allowedDriversIdentifiers
                    - estimatedTravelDuration
                    - estimatedTravelDistance
                    - notes
                    - packageCount
                    - weight
                    - type
                    - packageLabel
                    - stopPosition
                    - trackingLink
                    - webAppLink
                    - orderInfo
                    - placeInVehicle
                    - recipient
                    - deliveryInfo
                    - paymentOnDelivery
                    - proofOfAttemptRequirements
                    - plan
                    - route
                    - eta
                    - etaNullReason
                    - timing
                    - customProperties
                    - circuitClientId
                    additionalProperties: false
                    description: A stop of a plan, can be related to a route.
                description: Success
        '400':
          description: Query parameters are invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  code:
                    type: string
                    description: The error code.
                  param:
                    type: string
                    description: The parameter that caused the error.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: Query parameters are invalid
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: Unauthorized
        '403':
          description: Plan is no longer accessible due to data access restrictions. Upgrade to a plan that supports a longer delivery history period to access it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Plan is no longer accessible due to data access restrictions. Upgrade to a plan that supports a longer delivery history period to access it.
                  code:
                    type: string
                    enum:
                    - plan_inaccessible
                  url:
                    type: string
                    enum:
                    - https://dispatch.spoke.com/paywall
                required:
                - message
                - code
                - url
                description: Plan is no longer accessible due to data access restrictions. Upgrade to a plan that supports a longer delivery history period to access it.
        '404':
          description: The provided plan id does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Plan not found
                required:
                - message
                description: The provided plan id does not exist
                title: Plan not found
        '500':
          description: An internal server error occurred
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  code:
                    type: string
                    description: The error code.
                  param:
                    type: string
                    description: The parameter that caused the error.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: An internal server error occurred
        default:
          description: The default error model
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  code:
                    type: string
                    description: The error code.
                  param:
                    type: string
                    description: The parameter that caused the error.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: The default error model
  /plans/{planId}/stops:import:
    post:
      operationId: importStops
      summary: Batch import stops
      tags:
      - Stops
      description: Batch import stops. The request body must contain an array of stops to import. If the plan is not writable, the request will fail, prefer using the [Import Live Stops API](#tag/Live-Stops/operation/importLiveStops) instead.
      requestBody:
        content:
          application/json:
            schema:
              description: An array of stops to import in batch. Supports a maximum of 100 stops per request.
              minItems: 1
              maxItems: 100
              type: array
              items:
                type: object
                properties:
                  address:
                    type: object
                    properties:
                      addressName:
                        description: The name of the address. This will not be used for geocoding, and is only for the final address display purposes.
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 255
                        - type: 'null'
                      addressLineOne:
                        description: The first line of the address.
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 255
                        - type: 'null'
                      addressLineTwo:
                        description: The second line of the address.
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 255
                        - type: 'null'
                      city:
                        description: The city of the address.
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 100
                        - type: 'null'
                      state:
                        description: The state of the address.
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 100
                        - type: 'null'
                      zip:
                        description: The zip code of the address.
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 100
                        - type: 'null'
                      country:
                        description: The country of the address.
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 100
                        - type: 'null'
                      latitude:
                        description: The latitude of the address in decimal degrees.
                        anyOf:
                        - type: number
                          minimum: -90
                          maximum: 90
                        - type: 'null'
                      longitude:
                        description: The longitude of the address in decimal degrees.
                        anyOf:
                        - type: number
                          minimum: -180
                          maximum: 180
                        - type: 'null'
                    additionalProperties: false
                  timing:
                    anyOf:
                    - description: Timing information for this stop
                      type: object
                      properties:
                        earliestAttemptTime:
                          description: Time of day of the earliest time this stop should happen
                          anyOf:
                          - description: Time of day in hours and minutes. Use a 24 hour clock.
                            type: object
                            properties:
                              hour:
                                description: Hour of the day
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                              minute:
                                description: Minute of the hour
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                            required:
                            - hour
                            - minute
                            additionalProperties: false
                          - type: 'null'
                        latestAttemptTime:
                          description: Time of day of the latest time this stop should happen
                          anyOf:
                          - description: Time of day in hours and minutes. Use a 24 hour clock.
                            type: object
                            properties:
                              hour:
                                description: Hour of the day
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                              minute:
                                description: Minute of the hour
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                            required:
                            - hour
                            - minute
                            additionalProperties: false
                          - type: 'null'
                        estimatedAttemptDuration:
                          description: Duration in seconds of the activity in this stop, only set if you want to override the default. This can be set up to 8 hours.
