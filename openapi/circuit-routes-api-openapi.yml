                                          - MXN
                                          - NOK
                                          - NZD
                                          - PEN
                                          - RON
                                          - RUB
                                          - SAR
                                          - SEK
                                          - SGD
                                          - TRY
                                          - USD
                                          - UYU
                                          - ZAR
                                        - type: string
                                        description: 3-letter ISO 4217 currency code.
                                    required:
                                    - value
                                    - currency
                                    additionalProperties: false
                                    description: Price for this service at assignment time.
                                  hasPaymentOnDelivery:
                                    type: boolean
                                    description: Whether cash on delivery is enabled via the service.
                                  definedAt:
                                    type: number
                                    description: When the service was assigned in seconds since epoch.
                                required:
                                - identifier
                                - name
                                - slaStartsAt
                                - slaDueDate
                                - slaDueTime
                                - deliveryHorizon
                                - price
                                - hasPaymentOnDelivery
                                - definedAt
                                additionalProperties: false
                                description: Service offering data when a service is assigned to the stop.
                              - type: object
                                properties:
                                  identifier:
                                    type: 'null'
                                    description: Null indicates no service offering is linked.
                                  slaStartsAt:
                                    type: number
                                    description: The SLA start time in seconds since epoch.
                                required:
                                - identifier
                                - slaStartsAt
                                additionalProperties: false
                                description: Service data when only an SLA start time is set.
                              description: Service offering data for this stop.
                          required:
                          - status
                          - value
                          additionalProperties: false
                        - type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - empty
                          required:
                          - status
                          additionalProperties: false
                        - type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - restricted
                            requiredFeature:
                              type: string
                            upgradeUrl:
                              type: string
                            restrictionCode:
                              type: string
                              enum:
                              - subscription_not_supported
                          required:
                          - status
                          additionalProperties: false
                        description: Service offering data for this stop.
                    required:
                    - id
                    - address
                    - barcodes
                    - allowedDrivers
                    - estimatedTravelDuration
                    - estimatedTravelDistance
                    - notes
                    - packageCount
                    - weight
                    - type
                    - packageLabel
                    - stopPosition
                    - trackingLink
                    - webAppLink
                    - orderInfo
                    - placeInVehicle
                    - recipient
                    - deliveryInfo
                    - paymentOnDelivery
                    - proofOfAttemptRequirements
                    - plan
                    - route
                    - eta
                    - timing
                    - customProperties
                    - clientId
                    - serviceInfo
                    additionalProperties: false
