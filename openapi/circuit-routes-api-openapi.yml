                                        - type: string
                                          enum:
                                          - AED
                                          - ARS
                                          - AUD
                                          - BRL
                                          - CAD
                                          - CHF
                                          - CLP
                                          - CNY
                                          - COP
                                          - DKK
                                          - EGP
                                          - EUR
                                          - GBP
                                          - HKD
                                          - HUF
                                          - ILS
                                          - INR
                                          - JPY
                                          - KRW
