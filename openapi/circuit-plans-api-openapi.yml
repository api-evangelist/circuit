                          required:
                          - attempted
                          - attemptedAt
                          - timeAtStopInfo
                          - attemptedLocation
                          - driverProvidedInternalNotes
                          - driverProvidedRecipientNotes
                          - photoUrls
                          - recipientProvidedNotes
                          - signatureUrl
                          - signeeName
                          - succeeded
                          - state
                          additionalProperties: false
                          description: The delivery information of the stop.
