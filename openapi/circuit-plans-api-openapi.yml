                          - title
                          - stopCount
                          - driver
                          - state
                          - plan
                          additionalProperties: false
                          description: A route.
                        - type: 'null'
                        description: The route of the stop, if any.
                      eta:
                        oneOf:
                        - type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - available
                            value:
                              type: object
                              properties:
                                estimatedArrivalAt:
                                  type: number
                                  description: The estimated time in seconds since epoch.
                                estimatedLatestArrivalAt:
                                  type: number
                                  description: The latest estimated time in seconds since epoch.
                                estimatedEarliestArrivalAt:
                                  type: number
                                  description: The earliest estimated time in seconds since epoch.
                              required:
                              - estimatedArrivalAt
                              - estimatedLatestArrivalAt
                              - estimatedEarliestArrivalAt
                              additionalProperties: false
                              description: The estimated time of arrival data of the stop.
                          required:
                          - status
                          - value
                          additionalProperties: false
                        - type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - restricted
                            requiredFeature:
                              type: string
                            upgradeUrl:
                              type: string
                            restrictionCode:
                              type: string
                              enum:
                              - subscription_not_supported
                          required:
                          - status
                          additionalProperties: false
                        - type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - pending
                            pendingReason:
                              type: string
                              enum:
                              - not_optimized
                          required:
                          - status
                          additionalProperties: false
                      timing:
                        type: object
                        properties:
                          estimatedAttemptDuration:
                            anyOf:
                            - type: number
                            - type: 'null'
                            description: Time that the driver estimates to spend on the stop to do his job (deliver a parcel, visit a client, etc) in seconds.
                          earliestAttemptTime:
                            anyOf:
                            - type: object
                              properties:
                                hour:
                                  type: integer
                                  minimum: -9007199254740991
                                  maximum: 9007199254740991
                                  description: Hour of the day
                                minute:
                                  type: integer
                                  minimum: -9007199254740991
                                  maximum: 9007199254740991
                                  description: Minute of the hour
                              required:
                              - hour
                              - minute
                              additionalProperties: false
                              description: Time of day in hours and minutes. Uses a 24 hour clock.
                            - type: 'null'
                            description: The earliest time that the driver should arrive at the stop
                          latestAttemptTime:
                            anyOf:
                            - type: object
                              properties:
                                hour:
                                  type: integer
                                  minimum: -9007199254740991
                                  maximum: 9007199254740991
                                  description: Hour of the day
                                minute:
                                  type: integer
                                  minimum: -9007199254740991
                                  maximum: 9007199254740991
                                  description: Minute of the hour
                              required:
                              - hour
                              - minute
                              additionalProperties: false
                              description: Time of day in hours and minutes. Uses a 24 hour clock.
                            - type: 'null'
                            description: The latest time that the driver should arrive at the stop.
                        required:
                        - estimatedAttemptDuration
                        - earliestAttemptTime
                        - latestAttemptTime
                        additionalProperties: false
                        description: The timing data of the stop.
                      optimizationOrder:
                        default: default
                        type: string
                        enum:
                        - first
                        - last
                        - default
                      customProperties:
                        anyOf:
                        - type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            anyOf:
                            - type: string
                            - type: 'null'
                        - type: 'null'
                        description: Custom properties of the stop, can be used to store additional information.
                      clientId:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: The associated Client ID of the Spoke Connect
                      serviceInfo:
                        oneOf:
                        - type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - available
                            value:
                              anyOf:
                              - type: object
                                properties:
                                  identifier:
                                    type: string
                                    description: The service offering identifier, as configured in Spoke Dispatch, captured at assignment time. Not currently discoverable through the public API.
                                  name:
                                    type: string
                                    description: The human-readable service name.
                                  slaStartsAt:
                                    type: number
                                    description: The SLA start time in seconds since epoch.
                                  slaDueDate:
                                    type: object
                                    properties:
                                      day:
                                        type: integer
                                        minimum: 1
                                        maximum: 31
                                        description: The day of the date.
                                      month:
                                        type: integer
                                        minimum: 1
                                        maximum: 12
                                        description: The month of the date.
                                      year:
                                        type: integer
                                        minimum: 2000
                                        maximum: 2100
                                        description: The year of the date.
                                    required:
                                    - day
                                    - month
                                    - year
                                    additionalProperties: false
