                - type: object
                  properties:
                    message:
                      type: string
                      description: The error message.
                    code:
                      type: string
                      description: The error code.
                    param:
                      type: string
                      description: The parameter that caused the error.
                    url:
                      type: string
                      description: The URL with more information about the error.
                  required:
                  - message
                  description: Failed to validate the request
                - type: object
                  properties:
                    message:
                      type: string
                      enum:
                      - Driver is not active
                    code:
                      type: string
                      enum:
                      - driver_not_active
                    param:
                      type: string
                      description: The parameter that caused the error.
                  required:
                  - message
                  - code
                  description: The driver is not active
                  title: Driver is not active
                description: The request is invalid, or a driver is not active.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: Unauthorized
        '403':
          description: Plan is no longer accessible due to data access restrictions. Upgrade to a plan that supports a longer delivery history period to access it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
