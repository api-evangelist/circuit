        description: 'The request body for updating a plan. All the values present in the request will update the plan value, if you wish to update only certain fields, only set them and do not set the others. Any fields not set will not be updated.


          **Important:** Notice that the `drivers` Array will be completely replaced. If a single driver is provided in the request, the plan will have all other previous drivers discarded.'
      parameters:
      - schema:
          type: string
          pattern: ^[a-zA-Z0-9---_]{1,50}$
        in: path
        name: planId
        required: true
        description: The plan id
      responses:
        '200':
          description: The updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/planSchema'
                description: The updated plan
        '400':
          description: The request is invalid, or a driver is not active.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                      description: The error message.
                    code:
                      type: string
                      description: The error code.
                    param:
                      type: string
                      description: The parameter that caused the error.
                    url:
                      type: string
                      description: The URL with more information about the error.
                  required:
                  - message
                  description: Failed to validate the request
                - type: object
                  properties:
                    message:
                      type: string
                      enum:
                      - Driver is not active
                    code:
                      type: string
                      enum:
                      - driver_not_active
                    param:
                      type: string
                      description: The parameter that caused the error.
                  required:
                  - message
                  - code
                  description: The driver is not active
                  title: Driver is not active
                description: The request is invalid, or a driver is not active.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  url:
                    type: string
                    description: The URL with more information about the error.
                required:
                - message
                description: Unauthorized
        '403':
          description: Plan is no longer accessible due to data access restrictions. Upgrade to a plan that supports a longer delivery history period to access it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Plan is no longer accessible due to data access restrictions. Upgrade to a plan that supports a longer delivery history period to access it.
                  code:
                    type: string
                    enum:
                    - plan_inaccessible
                  url:
                    type: string
                    enum:
                    - https://dispatch.spoke.com/paywall
                required:
                - message
                - code
                - url
                description: Plan is no longer accessible due to data access restrictions. Upgrade to a plan that supports a longer delivery history period to access it.
        '404':
          description: The plan, depot, or driver could not be found.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                      enum:
                      - Plan not found
                  required:
                  - message
                  description: The provided plan id does not exist
                  title: Plan not found
                - type: object
                  properties:
                    message:
                      type: string
                      enum:
                      - Depot not found
                  required:
                  - message
                  description: The provided depot id does not exist
                  title: Depot not found
                - type: object
                  properties:
                    message:
                      anyOf:
                      - type: string
                        enum:
                        - Driver not found
                      - type: string
                  required:
                  - message
                  description: The provided driver id does not exist
                  title: Driver not found
                description: The plan, depot, or driver could not be found.
        '409':
          description: The plan is not writable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Plan is not writable
                  code:
                    type: string
                    enum:
                    - plan_not_writable
                required:
                - message
                - code
                description: The plan is not writable.
                title: Plan is not writable
        '412':
          description: Drivers and plans must have the same depot configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Driver does not share depot with plan
                  param:
                    type: string
                    description: The parameter that caused the error.
                required:
                - message
                description: Drivers and plans must have the same depot configured
                title: Plan and driver do not share a depot
        default:
          description: The default error model
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The error message.
                  code:
                    type: string
                    description: The error code.
