                                - completedAt
                                - distributed
                                - distributedAt
                                - notifiedRecipients
                                - notifiedRecipientsAt
                                - started
                                - startedAt
                                additionalProperties: false
                                description: The state of a route.
                              - type: 'null'
                              description: The state of the route.
                            plan:
                              anyOf:
                              - type: string
                                pattern: ^plans\/[a-zA-Z0-9---_]{1,50}$
                              - type: 'null'
