                          - status
                          additionalProperties: false
                        - type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - restricted
                            requiredFeature:
                              type: string
                            upgradeUrl:
                              type: string
                            restrictionCode:
                              type: string
                              enum:
                              - subscription_not_supported
