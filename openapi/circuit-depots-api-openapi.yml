                  - scooter
                  - car
                  - small_truck
                  - truck
                  - electric_cargo_bike
                - type: 'null'
                description: Default vehicle type for new routes from this depot.
              roundTrip:
                anyOf:
                - type: boolean
                - type: 'null'
                description: Return to start address at end of route
            required:
            - startTime
            - startAddress
          - type: 'null'
      required:
      - id
      - name
      - routeOverrides
      additionalProperties: false
      description: A depot.
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: Use the API key as the username and leave the password empty.
