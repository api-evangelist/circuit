components:
  schemas:
    depotIdSchema:
      type: string
      pattern: ^depots\/[a-zA-Z0-9---_]{1,50}$
    depotSchema:
      type: object
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/depotIdSchema'
          description: The depot id, in the format `depots/<id>`
        name:
          type: string
          description: The name of the depot.
        routeOverrides:
          anyOf:
          - type: object
            properties:
              startTime:
                type: object
                properties:
                  hour:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Hour of the day
                  minute:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Minute of the hour
                required:
                - hour
                - minute
                additionalProperties: false
                description: Default route start time.
              startAddress:
                type: object
                properties:
                  address:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The full address.
                  addressLineOne:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The first line of the address.
                  addressLineTwo:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The second line of the address.
                  latitude:
                    anyOf:
                    - type: number
                    - type: 'null'
                    description: Latitude coordinate of the depot in decimal degrees.
                  longitude:
                    anyOf:
                    - type: number
                    - type: 'null'
                    description: Longitude coordinate of the depot in decimal degrees.
                  placeId:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: A Google PlaceID identifying the location of the depot.
                  countryCode:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The country code of the address.
                required:
                - address
                - addressLineOne
                - addressLineTwo
                - latitude
                - longitude
                - placeId
                - countryCode
                description: The default start address for routes originating from this depot.
              defaultTimeAtStop:
                anyOf:
                - type: number
                - type: 'null'
                description: Estimated time at stop in seconds.
              endAddress:
                anyOf:
                - type: object
                  properties:
                    address:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: The full address.
                    addressLineOne:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: The first line of the address.
                    addressLineTwo:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: The second line of the address.
                    latitude:
                      anyOf:
                      - type: number
                      - type: 'null'
                      description: Latitude coordinate of the depot in decimal degrees.
                    longitude:
                      anyOf:
                      - type: number
                      - type: 'null'
                      description: Longitude coordinate of the depot in decimal degrees.
                    placeId:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: A Google PlaceID identifying the location of the depot.
                    countryCode:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: The country code of the address.
                  required:
                  - address
                  - addressLineOne
                  - addressLineTwo
                  - latitude
                  - longitude
                  - placeId
                  - countryCode
                  description: The default end address for routes originating from this depot (if empty, assume a round-trip).
                - type: 'null'
              endTime:
                anyOf:
                - type: object
                  properties:
                    hour:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                      description: Hour of the day
                    minute:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                      description: Minute of the hour
                  required:
                  - hour
                  - minute
                  additionalProperties: false
                  description: Default route end time.
                - type: 'null'
